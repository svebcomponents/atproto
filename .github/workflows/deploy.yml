name: Deploy host

on:
  push:
    branches: [main]
    paths:
      - "apps/host/**"
      - "packages/**"
      - "components/**"
      - "configs/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: install deps
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm --filter atproto-host... build

      - name: check
        run: pnpm --filter atproto-host... check

      - name: test
        run: pnpm --filter atproto-host... test

      - name: deploy
        env:
          DEPLOY_URL: ${{ secrets.EXE_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.EXE_DEPLOY_TOKEN }}
        run: |
          curl -sS --fail-with-body --max-time 600 \
            -X POST "$DEPLOY_URL" \
            -H "X-Exedev-Authorization: Bearer $DEPLOY_TOKEN"
