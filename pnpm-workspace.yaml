packages:
  - apps/*
  - components/*
  - packages/*
  - configs/*

allowBuilds:
  core-js: false
  esbuild: true
  svelte-preprocess: true

catalog:
  "@changesets/cli": 2.31.1
  "@eslint/compat": 2.1.0
  "@playwright/test": 1.62.1
  "@types/node": 24.13.3
  "@svebcomponents/build": 0.7.1
  "@svebcomponents/ssr": 0.8.0
  "@sveltejs/adapter-node": 5.5.7
  "@sveltejs/kit": 2.70.2
  "@sveltejs/vite-plugin-svelte": 7.2.0
  "@tsconfig/strictest": 2.0.8
  "@tsconfig/svelte": 5.0.8
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  eslint-config-prettier: 10.1.8
  eslint-plugin-svelte: 3.22.0
  globals: 16.5.0
  prettier: 3.9.6
  prettier-plugin-svelte: 3.5.2
  publint: 0.3.23
  svelte: 5.56.8
  svelte-check: 4.7.5
  turbo: 2.10.7
  typescript: 5.9.3
  typescript-eslint: 8.65.0
  vite: 8.1.5
  vitest: 4.1.10

# Our own scope is released by this project, so a release-age delay only blocks
# us from consuming a release we just cut.
minimumReleaseAgeExclude:
  - '@svebcomponents/*'
